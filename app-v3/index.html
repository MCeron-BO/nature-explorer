<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6B48">
<title>Nature Explorer Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="campo.css">
</head>
<body>
<div id="phone">
  <section id="s-inicio" class="screen" data-screen="inicio"></section>

  <section id="s-mapa" class="screen" data-screen="mapa">
    <div id="map" aria-label="Mapa satelital"></div>
    <div class="map-top">
      <div class="row">
        <a href="#inicio" class="fab" aria-label="Volver al inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></a>
        <button class="hud" id="hud" aria-label="Ver tu perfil, nivel y logros"></button>
        <button class="fab fun f-purple" id="btn-ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
      </div>
      <div class="row radii" id="radii"></div>
      <div id="loc-label" class="loc-label"></div>
    </div>
    <div class="map-side">
      <button class="fab fun round f-sky" id="btn-locate" aria-label="Usar mi ubicación GPS"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button class="fab fun round f-sun" id="btn-here" aria-label="Llevar mi avatar al centro del mapa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></button>
      <button class="fab fun round f-white" id="btn-credits" aria-label="Créditos del mapa"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
    </div>
    <div id="crosshair" aria-hidden="true"></div>
    <button id="radar" class="radar" hidden></button>
    <div id="near-card"></div>
    <div id="sheet" class="sheet"></div>
  </section>

  <section id="s-especies" class="screen" data-screen="especies"></section>
  <section id="s-ficha" class="screen scroll" data-screen="ficha"></section>
  <section id="s-captura" class="screen" data-screen="captura"></section>
  <section id="s-nuevo" class="screen" data-screen="nuevo"></section>
  <section id="s-coleccion" class="screen" data-screen="coleccion"></section>

  <nav id="tabbar" aria-label="Navegación principal">
    <a href="#mapa" data-tab="mapa"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg></span>Mapa</a>
    <a href="#especies" data-tab="especies"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></span>Especies</a>
    <button class="tab-go" data-act="capture-nearest" aria-label="Ir a la planta más cercana para capturarla"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v5M12 16v5M3 12h5M16 12h5"/></svg></span>Capturar</button>
    <a href="#nuevo" data-tab="nuevo"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span>Registrar</a>
    <a href="#coleccion" data-tab="coleccion"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span>Colección</a>
  </nav>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="xp-pop" class="xp-pop" aria-hidden="true"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="app.js"></script>
</body>
</html>
