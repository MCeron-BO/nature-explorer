<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B6B3A">
<title>Nature Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="prototipo.css">
</head>
<body>
<div id="phone">
  <section id="s-inicio" class="screen" data-screen="inicio"></section>

  <section id="s-mapa" class="screen" data-screen="mapa">
    <div id="map" aria-label="Mapa satelital"></div>
    <header class="map-head">
      <div class="row">
        <a href="#inicio" class="icon-btn" aria-label="Volver al inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></a>
        <div class="map-title"><span class="logo-leaf sm" aria-hidden="true"></span><div><b>Nature Explorer</b><span id="loc-label">Flora</span></div></div>
        <div class="km-step" role="group" aria-label="Radio de búsqueda">
          <button data-act="km-dec" id="km-dec" aria-label="Disminuir el radio 1 kilómetro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
          <output id="radii" aria-live="polite">5 km</output>
          <button data-act="km-inc" id="km-inc" aria-label="Aumentar el radio 1 kilómetro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
        </div>
        <button class="icon-btn" id="btn-ajustes" aria-label="Ajustes" data-keep="1"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
      <div class="map-search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <label for="mq" class="sr">Buscar especie en el mapa</label>
        <input id="mq" type="search" placeholder="Buscar especie" autocomplete="off" enterkeyhint="search">
        <b class="chip">Flora</b>
      </div>
      <div id="mq-res" class="mq-res" hidden></div>
    </header>
    <div class="map-side">
      <button class="fab round fun f-white" id="btn-locate" aria-label="Usar mi ubicación GPS"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      <button class="fab round fun f-white" id="btn-layers" aria-label="Cambiar capa del mapa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
      <button class="fab round fun f-white" id="btn-here" aria-label="Llevar mi avatar al centro del mapa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></button>
    </div>
    <div class="map-fabs" id="map-fabs">
      <button class="big-fab fun" data-act="capture-nearest" aria-label="Capturar la planta más cercana"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Capturar</span></button>
      <a class="big-fab fun" href="#nuevo" aria-label="Nuevo registro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Nuevo<br>Registro</span></a>
    </div>
    <div id="crosshair" aria-hidden="true"></div>
    <button id="radar" class="radar" hidden></button>
    <div id="near-card"></div>
    <div id="sheet" class="sheet"></div>
  </section>

  <section id="s-especies" class="screen" data-screen="especies"></section>
  <section id="s-ficha" class="screen scroll" data-screen="ficha"></section>
  <section id="s-captura" class="screen" data-screen="captura"></section>
  <section id="s-nuevo" class="screen" data-screen="nuevo"></section>
  <section id="s-coleccion" class="screen" data-screen="coleccion"></section>

  <nav id="tabbar" aria-label="Navegación principal">
    <a href="#mapa" data-tab="mapa"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg></span>Mapa</a>
    <a href="#especies" data-tab="especies"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V11"/><path d="M12 11c-4 0-7-3-7-7 4 0 7 3 7 7z"/><path d="M12 14c3 0 6-2.5 6-6-3 0-6 2.5-6 6z"/></svg></span>Especies</a>
    <a href="#nuevo" data-tab="nuevo"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span>Registrar</a>
    <a href="#coleccion" data-tab="coleccion"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span>Colección</a>
    <button data-act="more" data-tab="mas" aria-label="Más opciones"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></span>Más</button>
    <button data-act="tabs-hide" data-tab="ocultar" aria-label="Ocultar la barra inferior"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>Ocultar</button>
  </nav>
  <button id="tabs-show" class="tabs-show" data-act="tabs-show" aria-label="Mostrar la barra inferior" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>Menú</button>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="xp-pop" class="xp-pop" aria-hidden="true"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="app.js"></script>
</body>
</html>
